name: Update analytics

# Safety net for commits that skipped the local pre-commit hook
# (GitHub web edits, --no-verify, a clone without core.hooksPath set).
on:
  push:
    branches: [main]
    paths:
      - 'problems/**'
      - 'tests/**'
      - 'practice'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./practice readme
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md PROBLEMS.md EASY.md MEDIUM.md HARD.md; then
            echo "Analytics already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md PROBLEMS.md EASY.md MEDIUM.md HARD.md
          git commit -m "chore: update analytics"
          git push
